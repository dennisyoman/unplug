<script>
  (function () {
    var MOVE_MS = 500;
    var SIGNAL_PAUSE_MS = 1600;
    var ARC_PAUSE_MS = 300;
    var ALIGN = 6;
    var ARC_R = 8;
    var moving = false;
    var currentDir = null;
    var pauseTimer = null;
    var moveTimer = null;
    var arcRaf = null;
    var trailRaf = null;
    var moveGen = 0;
    var $selectedStart = null;
    var $tripGuidance = null;

    var turnRight = { up: "right", right: "down", down: "left", left: "up" };
    var turnLeft = { up: "left", left: "down", down: "right", right: "up" };

    // 僅紅／黃／綠繞圓；順時針弧角（紅→右、黃→直行、綠→左）
    var arcCwDeg = {
      red: 90,
      yellow: 180,
      green: 270,
    };
    var entryOffset = {
      down: { left: 0, top: -ARC_R },
      up: { left: 0, top: ARC_R },
      right: { left: -ARC_R, top: 0 },
      left: { left: ARC_R, top: 0 },
    };
    var exitOffset = {
      down: { left: 0, top: ARC_R },
      up: { left: 0, top: -ARC_R },
      right: { left: ARC_R, top: 0 },
      left: { left: -ARC_R, top: 0 },
    };
    // 標準數學角：0=東、CCW+；順時針掃掠時角度遞減
    var entryAngle = {
      right: Math.PI,
      down: -Math.PI / 2,
      left: 0,
      up: Math.PI / 2,
    };

    var getActiveGuidance = function () {
      return $(".PT4-6-1-5 .contents > div.selected").find(".guidance").first();
    };

    var getTripGuidance = function () {
      if ($tripGuidance && $tripGuidance.length) return $tripGuidance;
      return getActiveGuidance();
    };

    var getPos = function ($el) {
      return {
        left: parseFloat($el[0].style.left) || 0,
        top: parseFloat($el[0].style.top) || 0,
      };
    };

    // transition 進行中讀實際位置（style 會先跳到終點）
    var getVisualPos = function ($el) {
      var cs = window.getComputedStyle($el[0]);
      return {
        left: parseFloat(cs.left) || 0,
        top: parseFloat(cs.top) || 0,
      };
    };

    var clearMotion = function () {
      moveGen += 1;
      if (pauseTimer) {
        clearTimeout(pauseTimer);
        pauseTimer = null;
      }
      if (moveTimer) {
        clearTimeout(moveTimer);
        moveTimer = null;
      }
      if (arcRaf) {
        cancelAnimationFrame(arcRaf);
        arcRaf = null;
      }
      if (trailRaf) {
        cancelAnimationFrame(trailRaf);
        trailRaf = null;
      }
    };

    var getTrailPolyline = function ($guidance) {
      var $svg = $guidance.children("svg.texi-trail");
      if (!$svg.length) {
        var NS = "http://www.w3.org/2000/svg";
        var svg = document.createElementNS(NS, "svg");
        svg.setAttribute("class", "texi-trail");
        svg.setAttribute("width", "1");
        svg.setAttribute("height", "1");
        var poly = document.createElementNS(NS, "polyline");
        poly.setAttribute("points", "");
        svg.appendChild(poly);
        $guidance.prepend(svg);
        $svg = $(svg);
      }
      return $svg.children("polyline");
    };

    var appendTrailPoint = function ($guidance, x, y) {
      if (!$guidance || !$guidance.length) return;
      var $poly = getTrailPolyline($guidance);
      var next = x + "," + y;
      var pts = ($poly.attr("points") || "").trim();
      if (pts) {
        var parts = pts.split(/\s+/);
        if (parts[parts.length - 1] === next) return;
        $poly.attr("points", pts + " " + next);
      } else {
        $poly.attr("points", next);
      }
    };

    var clearTrail = function ($guidance) {
      if ($guidance && $guidance.length) {
        $guidance.children("svg.texi-trail").remove();
      } else {
        $(".PT4-6-1-5 .guidance > svg.texi-trail").remove();
      }
    };

    var trackTrailWhile = function ($el, $guidance, gen, durationMs) {
      var t0 = null;
      var step = function (now) {
        if (gen !== moveGen) {
          trailRaf = null;
          return;
        }
        if (t0 === null) t0 = now;
        var p = getVisualPos($el);
        appendTrailPoint($guidance, p.left, p.top);
        if (now - t0 < durationMs) {
          trailRaf = requestAnimationFrame(step);
        } else {
          trailRaf = null;
          p = getVisualPos($el);
          appendTrailPoint($guidance, p.left, p.top);
        }
      };
      trailRaf = requestAnimationFrame(step);
    };

    var setPos = function ($el, left, top, animate, done) {
      if (animate) {
        var gen = moveGen;
        var $guidance = $el.closest(".guidance");
        var drawTrail = $el.hasClass("active") && $guidance.length;
        if (drawTrail) {
          var from = getPos($el);
          appendTrailPoint($guidance, from.left, from.top);
          trackTrailWhile($el, $guidance, gen, MOVE_MS);
        }
        $el.css({
          transition:
            "left " + MOVE_MS + "ms linear, top " + MOVE_MS + "ms linear",
        });
        $el[0].offsetHeight;
        $el.css({ left: left + "px", top: top + "px" });
        moveTimer = setTimeout(function () {
          moveTimer = null;
          $el.css({ transition: "" });
          if (gen !== moveGen) return;
          if (drawTrail) appendTrailPoint($guidance, left, top);
          if (done) done();
        }, MOVE_MS);
      } else {
        $el.css({ transition: "", left: left + "px", top: top + "px" });
        if (done) done();
      }
    };

    var animateArc = function ($el, cx, cy, startAng, cwDeg, done) {
      var gen = moveGen;
      var duration = Math.max(200, (cwDeg / 90) * MOVE_MS);
      var endAng = startAng - (cwDeg * Math.PI) / 180;
      var t0 = null;
      var $guidance = $el.closest(".guidance");
      var drawTrail = $el.hasClass("active") && $guidance.length;
      $el.css({ transition: "" });
      var frame = function (now) {
        if (gen !== moveGen) {
          arcRaf = null;
          return;
        }
        if (t0 === null) t0 = now;
        var t = Math.min(1, (now - t0) / duration);
        var ang = startAng + (endAng - startAng) * t;
        var x = cx + ARC_R * Math.cos(ang);
        var y = cy + ARC_R * Math.sin(ang);
        $el[0].style.left = x + "px";
        $el[0].style.top = y + "px";
        if (drawTrail) appendTrailPoint($guidance, x, y);
        if (t < 1) {
          arcRaf = requestAnimationFrame(frame);
        } else {
          arcRaf = null;
          if (done) done();
        }
      };
      arcRaf = requestAnimationFrame(frame);
    };

    var applySignal = function (dir, signal) {
      if (signal === "yellow") return dir;
      if (signal === "red" || signal === "dog") return turnRight[dir];
      if (signal === "green" || signal === "man") return turnLeft[dir];
      return dir;
    };

    // 沿 direction 找下一個節點（signal / exit / deadend / start）
    var findNext = function ($guidance, fromLeft, fromTop, dir, $except) {
      var $nodes = $guidance.find(".signal, .exit, .deadend, .start");
      var best = null;
      var bestDist = Infinity;
      var exceptEl = $except && $except[0];
      $nodes.each(function () {
        if (exceptEl && this === exceptEl) return;
        var p = getPos($(this));
        var ok = false;
        var dist = 0;
        if (
          dir === "down" &&
          Math.abs(p.left - fromLeft) <= ALIGN &&
          p.top > fromTop + ALIGN
        ) {
          ok = true;
          dist = p.top - fromTop;
        } else if (
          dir === "up" &&
          Math.abs(p.left - fromLeft) <= ALIGN &&
          p.top < fromTop - ALIGN
        ) {
          ok = true;
          dist = fromTop - p.top;
        } else if (
          dir === "right" &&
          Math.abs(p.top - fromTop) <= ALIGN &&
          p.left > fromLeft + ALIGN
        ) {
          ok = true;
          dist = p.left - fromLeft;
        } else if (
          dir === "left" &&
          Math.abs(p.top - fromTop) <= ALIGN &&
          p.left < fromLeft - ALIGN
        ) {
          ok = true;
          dist = fromLeft - p.left;
        }
        if (ok && dist < bestDist) {
          bestDist = dist;
          best = $(this);
        }
      });
      return best;
    };

    var placeTexiAtStart = function ($guidance, keepSelection) {
      $guidance =
        $guidance && $guidance.length ? $guidance : getActiveGuidance();
      if (!$guidance.length) return;
      var $texi = $guidance.find(".texi");
      var $start =
        keepSelection &&
        $selectedStart &&
        $selectedStart.length &&
        $guidance[0] &&
        $.contains($guidance[0], $selectedStart[0])
          ? $selectedStart
          : $guidance.find(".start").first();
      $guidance.removeClass("started");
      $texi.removeClass("active seeing").css({ transition: "" });
      clearTrail($guidance);
      if ($start.length && $texi.length) {
        var p = getPos($start);
        setPos($texi, p.left, p.top, false);
      }
      if (keepSelection) $selectedStart = $start.length ? $start : null;
    };

    var stopAndResetAll = function () {
      clearMotion();
      moving = false;
      currentDir = null;
      $tripGuidance = null;
      $selectedStart = null;
      $(".PT4-6-1-5 .guidance").each(function () {
        placeTexiAtStart($(this), false);
      });
    };

    var moveStep = function () {
      var $guidance = getTripGuidance();
      var $texi = $guidance.find(".texi");
      if (!$guidance.length || !$texi.length) {
        moving = false;
        return;
      }
      var pos = getPos($texi);
      var $next = findNext($guidance, pos.left, pos.top, currentDir);
      if (!$next || !$next.length) {
        moving = false;
        return;
      }
      var dest = getPos($next);
      moving = true;
      rootSoundEffect($show);

      if ($next.hasClass("signal")) {
        var enterDir = currentDir;
        var signal = $next.attr("signal");
        var cwDeg = arcCwDeg[signal];
        // 紅／黃／綠：以該點 top/left 為圓心，半徑 ARC_R 繞行
        if (cwDeg) {
          var off = entryOffset[enterDir] || entryOffset.down;
          var startAng = entryAngle[enterDir] || entryAngle.down;
          setPos(
            $texi,
            dest.left + off.left,
            dest.top + off.top,
            true,
            function () {
              $texi.addClass("seeing");
              pauseTimer = setTimeout(function () {
                pauseTimer = null;
                $texi.removeClass("seeing");
                animateArc(
                  $texi,
                  dest.left,
                  dest.top,
                  startAng,
                  cwDeg,
                  function () {
                    currentDir = applySignal(enterDir, signal);
                    var out = exitOffset[currentDir] || { left: 0, top: 0 };
                    setPos(
                      $texi,
                      dest.left + out.left,
                      dest.top + out.top,
                      false,
                    );
                    pauseTimer = setTimeout(function () {
                      pauseTimer = null;
                      moveStep();
                    }, ARC_PAUSE_MS);
                  },
                );
              }, SIGNAL_PAUSE_MS);
            },
          );
          return;
        }
        // 空 signal：過點不停；man / dog：到點、轉向、暫停
        setPos($texi, dest.left, dest.top, true, function () {
          currentDir = applySignal(enterDir, signal);
          if (!signal) {
            moveStep();
            return;
          }
          $texi.addClass("seeing");
          pauseTimer = setTimeout(function () {
            pauseTimer = null;
            $texi.removeClass("seeing");
            moveStep();
          }, SIGNAL_PAUSE_MS);
        });
        return;
      }

      setPos($texi, dest.left, dest.top, true, function () {
        // exit 或再次走到 start：行程結束
        if ($next.hasClass("exit") || $next.hasClass("start")) {
          moving = false;
          rootSoundEffect($correct);
          $("#module_wrapper .sideTool .btn_replay").show();
          return;
        }
        if ($next.hasClass("deadend")) {
          moving = false;
          rootSoundEffect($fail);
          $("#module_wrapper .sideTool .btn_replay").show();
          return;
        }
        moving = false;
      });
    };

    var SIGNAL_CYCLE = ["red", "yellow", "green", "man", "dog", ""];

    var onSignalClick = function (e) {
      e.stopPropagation();
      var $signal = $(this);
      var $guidance = $signal.closest(".guidance");
      var $texi = $guidance.find(".texi");
      if (
        !$guidance.length ||
        $guidance.hasClass("fixed") ||
        $guidance.hasClass("started") ||
        $texi.hasClass("active") ||
        moving
      )
        return;

      var cur = $signal.attr("signal");
      if (cur == null) cur = "";
      var idx = SIGNAL_CYCLE.indexOf(cur);
      var next = SIGNAL_CYCLE[(idx < 0 ? 0 : idx + 1) % SIGNAL_CYCLE.length];
      $signal.attr("signal", next);
      rootSoundEffect($key);
    };

    var onStartClick = function (e) {
      e.stopPropagation();
      var $start = $(this);
      var $guidance = $start.closest(".guidance");
      var $texi = $guidance.find(".texi");
      if (
        !$guidance.length ||
        $guidance.hasClass("started") ||
        $texi.hasClass("active") ||
        moving
      )
        return;

      $selectedStart = $start;
      var p = getPos($start);
      setPos($texi, p.left, p.top, true);
      rootSoundEffect($key);
    };

    var onTexiClick = function (e) {
      e.stopPropagation();
      var $texi = $(this).closest(".texi");
      if (!$texi.length || $texi.hasClass("active") || moving) return;

      var $guidance = $texi.closest(".guidance");
      var $start =
        $selectedStart &&
        $selectedStart.length &&
        $guidance[0] &&
        $.contains($guidance[0], $selectedStart[0])
          ? $selectedStart
          : $guidance.find(".start").first();
      if (!$start.length) return;

      $tripGuidance = $guidance;
      currentDir = $start.attr("direction") || "down";
      $guidance.addClass("started");
      $texi.addClass("active");
      $("#module_wrapper .sideTool .btn_replay").hide();
      rootSoundEffect($pop);
      moveStep();
    };

    var SEQ_LETTERS = ["a", "b", "c", "d", "e"];

    var clearCustomInputs = function ($scope) {
      var $root = $scope && $scope.length ? $scope : $(".PT4-6-1-5");
      $root.find(".custom-inputs > div").each(function () {
        var $el = $(this);
        $el.removeClass("wrong");
        if ($el.hasClass("signal-sequence")) {
          $el.children("span").removeClass("wrong").text("");
        } else {
          $el.text("");
        }
      });
    };

    var fillCustomInputs = function ($scope) {
      var $root = $scope && $scope.length ? $scope : $(".PT4-6-1-5");
      $root.find(".custom-inputs > div").each(function () {
        var $el = $(this);
        $el.removeClass("wrong");
        var ans = ($el.attr("ans") || "").trim();
        if ($el.hasClass("signal-sequence")) {
          var parts = ans.split("-");
          $el.children("span").each(function (i) {
            $(this)
              .removeClass("wrong")
              .text(parts[i] || "");
          });
        } else {
          $el.text(ans);
        }
      });
    };

    var onSignalSequenceClick = function (e) {
      e.stopPropagation();
      var $span = $(this);
      $span.removeClass("wrong");
      var cur = ($span.text() || "").trim();
      var idx = SEQ_LETTERS.indexOf(cur);
      $span.text(SEQ_LETTERS[(idx + 1) % SEQ_LETTERS.length]);
      rootSoundEffect($key);
    };

    var syncSideTools_PT4_6_1_5 = function () {
      var isTask3 = $(".PT4-6-1-5 .contents > div.selected").index() === 2;
      var $answer = $("#module_wrapper .sideTool .btn_answer");
      var $check = $("#module_wrapper .sideTool .btn_check");
      if (isTask3) {
        $answer.removeClass("active").hide();
        $check.hide();
      } else {
        $answer.removeClass("active").show();
        $check.show();
      }
    };

    var withinResetElem_PT4_6_1_5 = function () {
      stopAndResetAll();
      clearCustomInputs($(".PT4-6-1-5 .contents > div.selected"));
      syncSideTools_PT4_6_1_5();
    };

    window.resetElem_PT4_6_1_5 = function () {
      withinResetElem_PT4_6_1_5();
      rootSoundEffect($show);
    };

    var EXIT_LABELS = [
      "I",
      "II",
      "III",
      "IV",
      "V",
      "VI",
      "VII",
      "VIII",
      "IX",
      "X",
    ];

    var selectExit_PT4_6_1_5 = function (item) {
      item.removeClass("wrong");
      var cur = (item.text() || "").trim();
      var idx = EXIT_LABELS.indexOf(cur);
      var next = EXIT_LABELS[(idx + 1) % EXIT_LABELS.length];
      item.text(next);
      rootSoundEffect($key);
    };

    var modifyAnswer_PT4_6_1_5 = function (item) {
      event.stopPropagation();
      event.stopImmediatePropagation();

      var text = window.prompt("請輸入答案：", item.text() || "");
      if (text === null) {
        rootSoundEffect($show);
        return;
      }
      item.text(text);
      rootSoundEffect($key);
    };

    window.showAnswer_PT4_6_1_5 = function (btn) {
      var $panel = $(".PT4-6-1-5 .contents > div.selected");
      if (!btn.hasClass("active")) {
        fillCustomInputs($panel);
        btn.addClass("active");
        rootSoundEffect($help);
        $("#module_wrapper .sideTool .btn_replay").show();
        $("#module_wrapper .sideTool .btn_check").hide();
      } else {
        btn.removeClass("active");
        clearCustomInputs($panel);
        $("#module_wrapper .sideTool .btn_check").show();
      }
    };

    window.checkAnswer_PT4_6_1_5 = function () {
      var $panel = $(".PT4-6-1-5 .contents > div.selected");
      var $targets = $panel.find(
        ".custom-inputs > .exit-id, .custom-inputs > .signal-sequence",
      );
      var wrong = false;

      $targets.removeClass("wrong");
      $targets.find("span").removeClass("wrong");
      $targets.each(function () {
        var $el = $(this);
        var ans = ($el.attr("ans") || "").trim();
        if ($el.hasClass("signal-sequence")) {
          var parts = ans.split("-");
          $el.children("span").each(function (i) {
            var got = ($(this).text() || "").trim();
            var expect = parts[i] || "";
            if (got !== expect) {
              $(this).addClass("wrong");
              wrong = true;
            }
          });
        } else {
          var got = ($el.text() || "").trim();
          if (got !== ans) {
            $el.addClass("wrong");
            wrong = true;
          }
        }
      });

      if (wrong) {
        rootSoundEffect($fail);
      } else {
        rootSoundEffect($correct);
        bingo();
      }
    };

    var bindAllGuidance = function () {
      $(".PT4-6-1-5 .guidance")
        .off(".pt615")
        .on("click.pt615", ".texi", onTexiClick)
        .on("click.pt615", ".start", onStartClick)
        .on("click.pt615", "[signal]", onSignalClick);
      $(".PT4-6-1-5 .custom-inputs")
        .off(".pt615seq")
        .on("click.pt615seq", ".signal-sequence > span", onSignalSequenceClick);
    };

    window.reactivate_PT4_6_1_5 = function () {
      withinResetElem = withinResetElem_PT4_6_1_5;
      window.selectExit_PT4_6_1_5 = selectExit_PT4_6_1_5;
      window.modifyAnswer_PT4_6_1_5 = modifyAnswer_PT4_6_1_5;
      bindAllGuidance();
    };

    $(function () {
      window.reactivate_PT4_6_1_5();
      stopAndResetAll();
      clearCustomInputs($(".PT4-6-1-5"));
    });
  })();
</script>
