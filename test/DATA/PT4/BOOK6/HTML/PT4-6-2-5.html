<script>
  (function () {
    var withinShowAnswer_PT4_6_2_5 = function (boolean) {
      if (!boolean) return;
      $(".contents > div.selected .wrong").removeClass("wrong");
      $(".contents > div.selected .sensors > .sensor.selected").removeClass(
        "selected",
      );
      $(".contents > div.selected .cross-keyboard").removeClass("active");
      $(".contents > div.selected .sensors > .sensor").each(function () {
        $(this).text($(this).attr("ans") || "");
      });
    };

    var fillKeys_PT4_6_2_5 = function () {
      var $keys = $(".contents > div.selected .keyboard .keys");
      if (!$keys.length) return;

      if (!$keys.hasClass("sync-PT4-6-2-4")) {
        $keys.children("span").each(function () {
          $(this).text($(this).attr("ans") || "");
        });
        return;
      }

      $keys.children("span").text("");
      var $page = $(".PT4-6-2-4");
      if (!$page.length) return;
      var $src = $page.find(".keys.sync-PT4-6-2-5 > span");
      var $dst = $keys.children("span");
      $src.each(function (i) {
        var text = ($(this).text() || "").trim();
        if (!text) return;
        $dst.eq(i).text(text);
      });
    };

    var withinCheckAnswer_PT4_6_2_5 = function () {
      var $sensors = $(".contents > div.selected .sensors > .sensor");
      $sensors.removeClass("wrong");
      var wrong = false;
      $sensors.each(function () {
        var ans = ($(this).attr("ans") || "").trim();
        var cur = ($(this).text() || "").trim();
        if (cur !== ans) {
          $(this).addClass("wrong");
          wrong = true;
        }
      });
      if (wrong) {
        rootSoundEffect($fail);
      } else {
        rootSoundEffect($correct);
        bingo();
      }
    };

    var withinResetElem_PT4_6_2_5 = function () {
      $(".contents > div.selected .sensors > .sensor")
        .not(".auto")
        .removeClass("selected wrong")
        .text("")
        .removeData("lastKeyAt lastSpan word");
      $(".contents > div.selected .sensors > .sensor.auto")
        .removeClass("wrong")
        .text("");
      $(".alert").remove();
      $(".contents > div.selected .character-board")
        .text("")
        .removeData("typing lastSpan lastAt cycle");
      $(".contents > div.selected .cross-keyboard").removeClass("active");
      fillKeys_PT4_6_2_5();

      if ($(".PT4-6-2-5 .contents > div:nth-child(2).selected").length > 0) {
        if (typeof window.PT4_6_2_mission2 === "undefined") {
          //表示還沒有玩過文生圖
          window.PT4_6_2_mission2 = true;
          console.log("還沒文生圖");
        } else {
          //已經玩過文生圖了
          window.PT4_6_2_mission2 = true;
          console.log("已經任務二");
          if (typeof window.updateMission2 !== "function") {
            console.log("還沒有updateMission2");
          } else {
            console.log("已經有updateMission2");
            window.updateMission2();
          }
        }
      }

      var $first = $(".contents > div.selected .sensors > .sensor")
        .not(".auto")
        .first();
      if ($first.length) selectSensor_PT4_6_2_5($first);
    };

    var selectSensor_PT4_6_2_5 = function (elem) {
      if (elem.hasClass("selected")) {
        rootSoundEffect($pop);
        return;
      }
      elem.addClass("selected").siblings().removeClass("selected");
      var word = elem.data("word") || "";
      var $board = $(".contents > div.selected .character-board");
      $board.text(word).removeData("lastSpan lastAt cycle");
      if (word) $board.data("typing", 1);
      else $board.removeData("typing");
      rootSoundEffect($pop);
    };

    var resetBoard_PT4_6_2_5 = function (elem) {
      var $task = $(".contents > div.selected");
      var $sensor = $task.find(".sensors > .sensor.selected").not(".auto");
      if ($sensor.length) {
        var group = $sensor.attr("group");
        $sensor.text("").removeData("lastKeyAt lastSpan word");
        if (group) {
          $task.find('.sensors > .sensor.auto[group="' + group + '"]').text("");
        }
      }
      var $board = elem.closest(".keyboard").children(".character-board");
      $board.text("").removeData("typing lastSpan lastAt cycle");
      rootSoundEffect($show);
    };

    var inputCharacter_PT4_6_2_5 = function (elem) {
      var $task = $(".contents > div.selected");
      var $sensor = $task.find(".sensors > .sensor.selected").not(".auto");
      if (!$sensor.length) {
        $(".alert").remove();
        $task.append(
          '<div class="alert wow bounceInUp" onclick="$(this).remove()">先選擇要輸入的欄位</div>',
        );
        rootSoundEffect($stupid);
        return;
      }

      var $cross = elem.closest(".keyboard").siblings(".cross-keyboard");
      if ($cross.length) {
        var letters = (elem.attr("ans") || "").split("");
        $cross.addClass("active");
        $cross.find(".keys > span").each(function (i) {
          $(this).text(letters[i] || "");
        });
      }

      var kid = String(elem.parent().children("span").index(elem) + 1);
      var now = Date.now();
      var last = $sensor.data("lastKeyAt") || 0;
      var lastEl = $sensor.data("lastSpan");
      var text = $sensor.text() || "";
      var switched = lastEl && lastEl !== elem.get(0);
      if (text && (now - last > 1000 || switched)) text += "-";
      $sensor.text(text + kid).data({ lastKeyAt: now, lastSpan: elem.get(0) });

      var group = $sensor.attr("group");
      if (group) {
        var $auto = $task.find(
          '.sensors > .sensor.auto[group="' + group + '"]',
        );
        $auto.each(function () {
          var n = parseInt($(this).text(), 10) || 0;
          $(this).text(n + 1);
        });
      }

      var $board = elem.closest(".keyboard").children(".character-board");
      var chars = elem.attr("ans") || "";
      if (!$cross.length && $board.length && chars) {
        var lastEl = $board.data("lastSpan");
        var lastAt = $board.data("lastAt") || 0;
        var cycle = $board.data("cycle") || 0;
        var same = lastEl === elem.get(0) && now - lastAt <= 1000;
        if (!$board.data("typing")) {
          $board.text("").data("typing", 1);
        }
        if (same && $board.text()) {
          cycle = (cycle + 1) % chars.length;
          $board.text($board.text().slice(0, -1) + chars.charAt(cycle));
        } else {
          cycle = 0;
          $board.text($board.text() + chars.charAt(0));
        }
        $board.data({ lastSpan: elem.get(0), lastAt: now, cycle: cycle });
        $sensor.data("word", $board.text());
      }

      $(".alert").remove();
      rootSoundEffect($key);
