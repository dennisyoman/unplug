<style>
  .PT4-5-4-4 .tti {
    padding: 8px;
    background: #ffffff;
  }
  .PT4-5-4-4 .toys .toy {
    margin: 5px auto;
  }
  .PT4-5-4-4 .sensors {
    position: absolute;
  }
  .PT4-5-4-4 .sensors.mission1 {
    display: none;
  }
  .PT4-5-4-4 .sensors > .sensor {
    position: absolute;
    font-size: 12px;
    line-height: 12px;
    display: grid;
    place-items: center;
    z-index: 2;
    pointer-events: auto;
    cursor: pointer;
  }

  .PT4-5-4-4 .tti.mission1::after {
    content: "";
    position: absolute;
    width: 100%;
    left: 0;
    bottom: 0;
    height: 50px;
    background: #fff;
  }
</style>

<script>
  var fillContent = (item) => {
    event.stopPropagation();
    event.stopImmediatePropagation();
    var text = window.prompt("請輸入正確答案：", "");
    if (text === null) {
      rootSoundEffect($show);
      return; // 取消則不處理
    } else {
      rootSoundEffect($pop);
      item.html(text);
      rootSoundEffect($key);
      $("#module_wrapper .sideTool .btn_replay").show();
    }
  };

  var showAnswer_PT4_5_4_4 = function (btn) {
    if (!btn.hasClass("active")) {
      $(".PT4-5-4-4 .contents .sensors:not(.mission1) .sensor").each(
        function () {
          var ans = $(this).attr("ans");
          $(this).html(ans);
        },
      );
    } else {
      resetElem_PT4_5_4_4();
    }
  };
  var resetElem_PT4_5_4_4 = function () {
    $(".PT4-5-4-4 .contents .sensors .sensor").html("");
  };

  var updateMission1_PT4_5_4_4 = function () {
    var mission1Span = `<span
            ox="0"
            oy="0"
            style="
              position: absolute;
              width: 30px;
              height: 30px;
              top: 267px;
              left: -2px;
            "
            group="g"
          ></span>
          <span
            ox="0"
            oy="0"
            style="
              position: absolute;
              width: 30px;
              height: 30px;
              top: 267px;
              left: 152px;
            "
            group="h"
          ></span>`;
    //秀出mission1物件
    if ($(".PT4-5-4-4 .toy[group='a']").length > 0) {
      $(".PT4-5-4-4 .toy[group='a']")
        .attr("group", "a^h")
        .attr("ap", "11,332^280,332");
      $(".PT4-5-4-4 .toy[group='c']")
        .attr("group", "c^g")
        .attr("ap", "100,332^280,178");
      $(".PT4-5-4-4 .sensorArea").append(mission1Span);
      $(".PT4-5-4-4 .mission1").removeClass("mission1");
    }
    //能到這裡表示任務一玩過了
    updateMission1_PT4_5_4_5();
  };
  // global flag: keep existing value if already defined
  if (typeof window.PT4_5_4_4_mission1 === "undefined") {
    //表示還沒有玩過任務一
    window.PT4_5_4_4_mission1 = false;
    console.log("還沒任務一");
  } else {
    //已經玩過任務一了
    console.log("已經任務一");
    updateMission1_PT4_5_4_4();
  }

  // keep 回來：若任務一已玩過，再同步一次
  window.reactivate_PT4_5_4_4 = function () {
    window.fillContent = fillContent;
    window.showAnswer_PT4_5_4_4 = showAnswer_PT4_5_4_4;
    window.resetElem_PT4_5_4_4 = resetElem_PT4_5_4_4;
    if (window.PT4_5_4_4_mission1) {
      updateMission1_PT4_5_4_4();
    }
  };

  window.reactivate_PT4_5_4_4();
</script>
