<script>
  var ROUTE_SIZE_PT4_5_1_5 = 20;
  var ROUTE_GAP_PT4_5_1_5 = 28;

  // min~max 循環切換數字（空值從 min 起）
  var switchNumber_PT4_5_1_5 = function (min, max, $el) {
    var current = parseInt(($el.text() || "").trim(), 10);
    var next;
    if (isNaN(current) || current < min || current >= max) {
      next = min;
    } else {
      next = current + 1;
    }
    $el.text(String(next));
    rootSoundEffect($key);
    $("#module_wrapper .sideTool .btn_replay").show();
  };

  var RESTORE_POINTS_PT4_5_1_5 = ["D-E", "A-C", "D-F"];

  // 在 D-E / A-C / D-F 之間輪替
  var switchRestorePoints_PT4_5_1_5 = function ($el) {
    var current = ($el.text() || "").trim();
    var idx = RESTORE_POINTS_PT4_5_1_5.indexOf(current);
    var next =
      RESTORE_POINTS_PT4_5_1_5[(idx + 1) % RESTORE_POINTS_PT4_5_1_5.length];
    if (idx < 0) next = RESTORE_POINTS_PT4_5_1_5[0];
    $el.text(next);
    rootSoundEffect($key);
    $("#module_wrapper .sideTool .btn_replay").show();
  };

  // 任務三標準島圖（同 PT4-5-1-4）
  var ANSWER_LINKS_PT4_5_1_5 = [
    ["D", "E", "5"],
    ["E", "F", "4"],
    ["C", "E", "2"],
    ["B", "D", "3"],
    ["C", "D", "4"],
    ["B", "C", "2"],
    ["A", "B", "8"],
    ["D", "F", "3"],
    ["A", "C", "9"],
  ];

  // ---------- 任務三：島圖連線（純顯示） ----------
  var getNameCenter_PT4_5_1_5 = function ($span, $graph) {
    var ratio = stageRatioReal || 1;
    var cOff = $graph.offset();
    var r = $span[0].getBoundingClientRect();
    return {
      x: (r.left + r.width / 2 - cOff.left) / ratio,
      y: (r.top + r.height / 2 - cOff.top) / ratio,
    };
  };

  var setGraphLineGeom_PT4_5_1_5 = function ($line, start, end) {
    var dx = end.x - start.x;
    var dy = end.y - start.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    var deg = (Math.atan2(dy, dx) * 180) / Math.PI;
    $line.css({
      left: start.x + "px",
      top: start.y - 1.5 + "px",
      width: Math.max(len, 0) + "px",
      transform: "rotate(" + deg + "deg)",
    });
    // 限重數字反向旋轉，保持直立
    $line.find(".line-ui").css({
      transform: "translate(-50%, -50%) rotate(" + -deg + "deg)",
    });
  };

  var appendGraphLine_PT4_5_1_5 = function ($graph, fromId, toId, weight) {
    if (!$graph || !$graph.length || !fromId || !toId || fromId === toId) {
      return;
    }
    var $names = $graph.find(".names");
    var $lines = $graph.find(".lines");
    var exists =
      $lines.find(
        '.line[from="' +
          fromId +
          '"][to="' +
          toId +
          '"], .line[from="' +
          toId +
          '"][to="' +
          fromId +
          '"]',
      ).length > 0;
    if (exists) return;

    var $from = $names.find('span[ans="' + fromId + '"]');
    var $to = $names.find('span[ans="' + toId + '"]');
    if (!$from.length || !$to.length) return;

    var $line = $(

  var layoutOneRoutesRow_PT4_5_1_5 = function ($row, ratio) {
    var rowRect = $row[0].getBoundingClientRect();
    var groups = {};
    var order = [];

    $row.children(".route").each(function () {
      var from = $(this).attr("from") || "";
      if (!groups[from]) {
        groups[from] = [];
        order.push(from);
      }
      groups[from].push($(this));
    });

    order.forEach(function (from) {
      var $children = groups[from];
      var $anchor = $();
      $row.prevAll(".routes").each(function () {
        var $hit = $(this).children('.route[rid="' + from + '"]');
        if ($hit.length) {
          $anchor = $hit.eq(0);
          return false;
        }
      });
      if (!$anchor.length) return;

      var anchorRect = $anchor[0].getBoundingClientRect();
      var anchorCenterX =
        (anchorRect.left + anchorRect.width / 2 - rowRect.left) / ratio;

      var n = $children.length;
      var totalSpan = (n - 1) * ROUTE_GAP_PT4_5_1_5;
      var startCenterX = anchorCenterX - totalSpan / 2;

      $children.forEach(function ($child, i) {
        var left =
          startCenterX + i * ROUTE_GAP_PT4_5_1_5 - ROUTE_SIZE_PT4_5_1_5 / 2;
        $child.css("left", left + "px");
      });
    });
  };

  var initRouteGeometry_PT4_5_1_5 = function ($scope) {
    var $item;
    if ($scope && $scope.length) {
      // 可傳 .item 本身，或傳上層容器再往下找
      $item = $scope.hasClass("item") ? $scope : $scope.find(".group .item");
    }
    if (!$item || !$item.length) {
      $item = $(".PT4-5-1-5 .contents > div.selected .group .item");
    }
    if (!$item.length) {
      $item = $(".PT4-5-1-5 .contents > div:first-child .group .item");
    }
    if (!$item.length) return;

    var ratio = stageRatioReal || 1;
    $item.addClass("measuring");

    // 上層 route 要蓋過下層畫出來的線（避免線壓到父節點文字）
    $item.find(".routes").each(function (i) {
      $(this).css("z-index", 20 - i);
    });

    // 逐列排位置（每列後 reflow，下一列才量得到正確父節點）
    $item.find(".routes:not(.start)").each(function () {
      layoutOneRoutesRow_PT4_5_1_5($(this), ratio);
      void this.offsetHeight;
    });

    $item.find(".routes .route").each(function () {
      var $route = $(this);
      var from = $route.attr("from");
      var rid = $route.attr("rid");
      var to = $route.attr("to");

      if (!from || from === rid || from === to) {
        $route.addClass("self");
        setRouteLine_PT4_5_1_5($route, 0, 0);
        return;
      }
      $route.removeClass("self");

      var $fromRoute = findFromRoute_PT4_5_1_5($route);
      if (!$fromRoute.length) {
        setRouteLine_PT4_5_1_5($route, 0, 0);
        return;
      }

      var r1 = $route[0].getBoundingClientRect();
      var r2 = $fromRoute[0].getBoundingClientRect();
      var x1 = r1.left + r1.width / 2;
      var y1 = r1.top + r1.height / 2;
      var x2 = r2.left + r2.width / 2;
      var y2 = r2.top + r2.height / 2;
      var dx = (x2 - x1) / ratio;
      var dy = (y2 - y1) / ratio;
      var full = Math.sqrt(dx * dx + dy * dy);
      var angle = (Math.atan2(dx, -dy) * 180) / Math.PI;
      setRouteLine_PT4_5_1_5($route, full, angle);
    });

    $item.removeClass("measuring");
  };

  // 由 done+selected(ans=1) 往上走，組出目前葉節點路徑（含 A）
  var collectRoutePaths_PT4_5_1_5 = function ($item) {
    var $selected = $item.find('.routes.done .route.selected[ans="1"]');
    var paths = [];

    $selected.each(function () {
      var $leaf = $(this);
      var rid = $leaf.attr("rid");
      var hasChild = false;
      $selected.each(function () {
        if ($(this).attr("from") === rid) {
          hasChild = true;
          return false;
        }
      });
      if (hasChild) return;

      var parts = [];
      var $cur = $leaf;
      var guard = 0;
      while ($cur.length && guard++ < 20) {
        parts.unshift($cur.attr("to"));
        var from = $cur.attr("from");
        var curRid = $cur.attr("rid");
        if (!from || from === curRid) break;
        $cur = $item.find('.route[rid="' + from + '"]').first();
      }
      parts.unshift("A");
      paths.push(parts.join("-"));
    });

    return paths;
  };
