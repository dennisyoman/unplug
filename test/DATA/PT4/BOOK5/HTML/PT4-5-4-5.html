<script>
  var switchYN = (item) => {
    var group = item.attr("group");
    var groupItems = $(".PT4-5-4-5 .sensors .sensor.yn[group='" + group + "']");
    groupItems.removeClass("active");
    item.addClass("active");
    rootSoundEffect($key);
    $("#module_wrapper .sideTool .btn_replay").show();
  };

  var pasteMe = (id, item) => {
    var filling_target = item
      .closest(".item.selected")
      .find(".sensors .sensor.filling.selected");

    if (filling_target.length > 0) {
      if (filling_target.attr("sid") == id) {
        filling_target.removeClass("selected");
        filling_target.html(filling_target.attr("ans"));
        //顯示token
        var tidArray = filling_target.attr("tid").split("^");
        tidArray.forEach(function (tid) {
          filling_target
            .closest(".sensors")
            .find(".sensor.token[tid='" + tid + "']")
            .addClass("active");
        });
        $("#module_wrapper .sideTool .btn_replay").show();
        rootSoundEffect($chimes);
      } else {
        rootSoundEffect($stupid);
        showTaskAlert("選錯貼紙了，再考慮一下。");
      }
    } else {
      showTaskAlert("請先選擇一個箭頭");
    }
  };

  var addToken = (item) => {
    var kid_target = item
      .closest(".item.selected")
      .find(".sensors .sensor.kids");
    var filling_target = item
      .closest(".item.selected")
      .find(".sensors .sensor.filling.selected");

    if (filling_target.length > 0) {
      var token = item.find("img").clone();
      token.on("click", function () {
        event.stopPropagation();
        event.stopImmediatePropagation();
        rootSoundEffect($show);
        $(this).remove();
      });
      filling_target.append(token);
      $("#module_wrapper .sideTool .btn_replay").show();
      rootSoundEffect($pop);
      //確認誰拿到飲料
      if (item.attr("tid") == "C") {
        var kidSrc =
          "./DATA/PT4/BOOK5/IMAGES/kid-" + filling_target.attr("kid") + ".png";
        if (kid_target.find('img[src="' + kidSrc + '"]').length === 0) {
          kid_target.append(
            '<img width="20px" height="20px" src="' + kidSrc + '" />',
          );
          rootSoundEffect($chimes);
        }
      }
      $("#module_wrapper .sideTool .btn_check").show();
    } else {
      showTaskAlert("請先選擇一個問題區塊");
    }
  };

  var updateMission1_PT4_5_4_5 = function () {
    $(".alert").remove();
    $(".PT4-5-4-5 .mission1").removeClass("mission1");
  };

  //共用
  var showTaskAlert = function (msg) {
    $(".alert").remove();
    $(".contents > div.selected").append(
      '<div class="alert wow bounceInUp" onclick="$(this).remove()">' +
        msg +
        "</div>",
    );
    rootSoundEffect($stupid);
  };

  var toggleClass = (item, className) => {
    item.siblings("." + className).removeClass(className);
    item.toggleClass(className);
    item.removeClass("incorrect");
    rootSoundEffect($key);
    $("#module_wrapper .sideTool .btn_replay").show();
  };

  var fillContent = (item) => {
    event.stopPropagation();
    event.stopImmediatePropagation();
    var text = window.prompt("請輸入正確答案：", "");
    if (text === null) {
      rootSoundEffect($show);
      return; // 取消則不處理
    } else {
      item.html(text);
      rootSoundEffect($key);
      $("#module_wrapper .sideTool .btn_replay").show();
    }
  };

  var showAnswer_PT4_5_4_5 = function (btn) {
    $(".alert").remove();
    if (!btn.hasClass("active")) {
      //任務一
      if ($(".PT4-5-4-5 .contents > div:nth-child(1).selected").length > 0) {
        var currentContainer = $(
          ".PT4-5-4-5 .contents > div:nth-child(1).selected",
        );
        currentContainer.find(".sensors .sensor.filling").each(function () {
          $(this).html($(this).attr("ans"));
        });
        currentContainer.find(".sensors .sensor.token").addClass("active");
      }
      //任務二
      if ($(".PT4-5-4-5 .contents > div:nth-child(2).selected").length > 0) {
        var currentContainer = $(
          ".PT4-5-4-5 .contents > div:nth-child(2).selected",
        );
        currentContainer.find(".sensors .sensor.yn").each(function () {
          if ($(this).attr("ans") == "1") {
            $(this).addClass("active");
          } else {
            $(this).removeClass("active");
          }
        });
        currentContainer.find(".sensors .sensor.paragraph").each(function () {
          $(this).html($(this).attr("ans"));
        });
      }
      //任務三
      if ($(".PT4-5-4-5 .contents > div:nth-child(3).selected").length > 0) {
        var currentContainer = $(
          ".PT4-5-4-5 .contents > div:nth-child(3).selected",
        );
        currentContainer.find(".sensors .sensor.filling").each(function () {
          $(this).empty();
          var ansArray = $(this).attr("ans").split("");
          var tokenContainer = $(this);
          ansArray.forEach(function (ans) {
            tokenContainer.append(
              `<img width="20px" height="20px" src="./DATA/PT4/BOOK5/IMAGES/PT4-5-4-token-${ans}.png" />`,
            );
          });
        });
        currentContainer.find(".sensors .sensor.kids").each(function () {
          $(this).empty();
          var ansArray = $(this).attr("ans").split("");
          var tokenContainer = $(this);
          ansArray.forEach(function (ans) {
            tokenContainer.append(
              `<img width="20px" height="20px" src="./DATA/PT4/BOOK5/IMAGES/kid-${ans}.png" />`,
            );
          });
        });
      }
      $("#module_wrapper .sideTool .btn_replay").show();
    } else {
      resetElem_PT4_5_4_5();
    }
  };

  var resetElem_PT4_5_4_5 = function () {
    $(".alert").remove();
    //任務一
    if ($(".PT4-5-4-5 .contents > div:nth-child(1).selected").length > 0) {
      $(".PT4-5-4-5 .contents .sensors .sensor.filling").html("");
      $(".PT4-5-4-5 .contents .sensors .sensor.token").removeClass("active");
    }
    //任務一
    if ($(".PT4-5-4-5 .contents > div:nth-child(2).selected").length > 0) {
      $(".PT4-5-4-5 .contents .sensors .sensor.yn").removeClass("active");
      $(".PT4-5-4-5 .contents .sensors .sensor.paragraph").html("");
    }
    //任務三
    if ($(".PT4-5-4-5 .contents > div:nth-child(3).selected").length > 0) {
      $(".PT4-5-4-5 .contents .sensors .sensor.filling").html("");
      $(".PT4-5-4-5 .contents .sensors .sensor.kids").html("");
    }
  };

  var checkAnswer_PT4_5_4_5 = function () {
    $(".alert").remove();
    //任務三
    if ($(".PT4-5-4-5 .contents > div:nth-child(3).selected").length > 0) {
      var getWrong = false;
      var currentContainer = $(
        ".PT4-5-4-5 .contents > div:nth-child(3).selected",
      );
      currentContainer.find(".sensors .sensor.filling").each(function () {
        $(this).removeClass("incorrect");
        var ans = $(this).attr("ans");
        var yourAns = "";
        var tokens = $(this).find("img");
