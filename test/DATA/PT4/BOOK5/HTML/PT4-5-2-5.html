<script>
  var toggleYN_PT4_5_2_5 = (item) => {
    var NYArr = ["v", ""];
    event.stopPropagation();
    event.stopImmediatePropagation();
    rootSoundEffect($key);
    var text = item.text();
    item.removeClass("wrong");
    if (NYArr.includes(text)) {
      var currentIndex = NYArr.indexOf(text);
      var nextIndex = (currentIndex + 1) % NYArr.length;
      item.html(NYArr[nextIndex]);
    } else {
      item.html(NYArr[0]);
    }
    //
    $(".sideTool > div.btn_replay").show();
  };

  var addRoute_PT4_5_2_5 = (item) => {
    event.stopPropagation();
    event.stopImmediatePropagation();
    rootSoundEffect($pop);
    item.toggleClass("selected");
    $(".PT4-5-2-5 .ref .reset-btn").addClass("selected");
  };

  var resetRoute_PT4_5_2_5 = () => {
    $(".PT4-5-2-5 .ref .line").removeClass("selected");
    $(".PT4-5-2-5 .ref .reset-btn").removeClass("selected");
    rootSoundEffect($show);
  };

  var addArrow_PT4_5_2_5 = (item) => {
    if (item.parent().parent().hasClass("code")) {
      var frame = $(".contents > div.selected").find(".puzzle .items.selected");
      var me = frame.children().last();
      var from = me.prev();
      var fromIid = from.attr("iid");
      if (!fromIid) {
        fromIid = frame.attr("firstIid");
      }
      console.log(fromIid);
      var iid = me.attr("iid");
      var allRoutes = me.attr("routes");

      var routeID = "　";
      if (allRoutes) {
        allRoutes = allRoutes.split(",");
        allRoutes.forEach((route) => {
          var routeParts = route.split(":");
          var fromId = routeParts[0];
          var routeId = routeParts[1];
          if (fromIid === fromId) {
            routeID = routeId;
          }
        });
      }

      me.prepend("<span class='routeArrow'>" + routeID + "</span>");
    }
  };

  var checkAnswer_PT4_5_2_5 = () => {
    event.stopPropagation();
    event.stopImmediatePropagation();
    //任務二
    if ($(".PT4-5-2-5 .contents > div:nth-child(2).selected").length > 0) {
      //code
      var getWrong = false;
      var codeItems = $(".contents > div.selected .code").find(".items > span");
      //puzzle
      var items = $(".contents > div.selected .puzzle").find(".items");
      items.each(function () {
        $(this).removeClass("selected");
        var kids = $(this).find(">span");
        kids.removeClass("wrong");
        var kidArray = [];
        for (var k = 0; k < kids.length; k++) {
          kidArray.push({ key: kids.eq(k).attr("iid"), seq: k });
        }
        var answersArr = $(this).attr("ans").split("^");
        var itemMatched = false;
        for (var a = 0; a < answersArr.length; a++) {
          var answerArr = answersArr[a].split(",");
          //ans是空值代表沒有答案
          if ($(this).attr("ans") == "") {
            answerArr = [];
          }

          var thisWrong = false;
          if (kids.length == answerArr.length) {
            //檢查是否正確
            for (var i = 0; i < answerArr.length; i++) {
              if (answerArr[i] != kidArray[i].key) {
                //錯一個全錯
                thisWrong = true;
                break;
              }
            }
          } else {
            //數量不對
            thisWrong = true;
          }
          //有正確答案就跳出
          if (!thisWrong) {
            itemMatched = true;
            break;
          }
        }
        if (!itemMatched) {
          kids.addClass("wrong");
          getWrong = true;
        }
      });

      if (getWrong) {
        //
        rootSoundEffect($wrong);
        $(".contents > div.selected .puzzle").append(
          `<span class="resultIcon wow bounceIn"><img src="./DATA/IMAGES/common/icon_stupid.png"/></span>`,
        );
        $(".resultIcon")
          .delay(1500)
          .queue(function () {
            $(this).dequeue().remove();
          });
      } else {
        rootSoundEffect($chimes);
        var uniq = new Date().getTime();
        $(".contents > div.selected .puzzle").append(
          `<span class="resultIcon wow bounceIn"><img src="./DATA/IMAGES/common/icon_right.png"/></span><span class="smoke"><img src="./DATA/IMAGES/common/chimes.gif?uniq=${uniq}"/></span>`,
        );
        $(".smoke")
          .delay(1500)
          .queue(function () {
            $(".resultIcon").remove();
            $(this).dequeue().remove();
          });
      }
      return;
    }

    //任務三：直接在本檔 check btn 檢查
    if ($(".PT4-5-2-5 .contents > div:nth-child(3).selected").length > 0) {
      var ynWrong = false;
      $(
        ".PT4-5-2-5 .contents > div:nth-child(3).selected .conditions .column-yn",
      ).each(function () {
        var ans = $(this).attr("ans");
        if (ans !== $(this).text()) {
          $(this).addClass("wrong");
          ynWrong = true;
        } else {
          $(this).removeClass("wrong");
        }
      });
      if (ynWrong) {
        rootSoundEffect($wrong);
        $(".resultIcon, .smoke").remove();
      } else {
        rootSoundEffect($chimes);
        var uniq3 = new Date().getTime();
        $(".contents > div.selected").append(
          `<span class="resultIcon wow bounceIn"><img src="./DATA/IMAGES/common/icon_right.png"/></span><span class="smoke"><img src="./DATA/IMAGES/common/chimes.gif?uniq=${uniq3}"/></span>`,
        );
        $(".smoke")
          .delay(1500)
          .queue(function () {
            $(".resultIcon").remove();
            $(this).dequeue().remove();
          });
      }
      return;
    }

    //任務一：走 decode 預設
    checkAnswer();
  };

  /* 共用 */
  var modifyCondition_PT4_5_2_5 = (item) => {

  var showAnswer_PT4_5_2_5 = function (btn) {
    $(".alert").remove();
    if (!btn.hasClass("active")) {
      $(".contents > div.selected .conditions")
        .find(".column-condition")
        .each(function () {
          $(this).html($(this).attr("ans"));
        });
      $(".contents > div.selected .conditions")
        .find(".column-yn")
        .each(function () {
          $(this).html($(this).attr("ans"));
        });
      $(".contents > div.selected .conditions")
        .find(".column-route")
        .each(function () {
          $(this).html($(this).attr("ans"));
        });
      //任務二
      if ($(".PT4-5-2-5 .contents > div:nth-child(2).selected").length > 0) {
        var items = $(".PT4-5-2-5 .contents > div:nth-child(2) .puzzle").find(
          ".items",
        );
        var codeItems = $(".PT4-5-2-5 .contents > div:nth-child(2) .code").find(
          ".items > span",
        );
        items.each(function () {
          $(this).empty().addClass("selected");
          var answersArr = $(this).attr("ans").split("^");
          var answerArr = answersArr[0].split(",");
          for (var i = 0; i < answerArr.length; i++) {
            for (var k = 0; k < codeItems.length; k++) {
              if (codeItems.eq(k).attr("iid") == answerArr[i]) {
                codeItems.eq(k).click();
              }
            }
          }
          $(this).removeClass("selected");
        });
      }

      rootSoundEffect($help);
      $("#module_wrapper .sideTool .btn_replay").show();
      $("#module_wrapper .sideTool .btn_check").hide();
    } else {
      resetElem_PT4_5_2_5();
    }
  };

  var resetElem_PT4_5_2_5 = function () {
    $(".contents > div.selected .conditions")
      .find(".column-condition")
      .html("");
    $(".contents > div.selected .conditions").find(".column-yn").html("");
    $(".contents > div.selected .conditions").find(".column-route").html("");
  };

  var withinCheckAnswer_PT4_5_2_5 = function () {};

  // keep 回來：重掛 hook + HTML onClick
  window.reactivate_PT4_5_2_5 = function () {

    window.toggleYN_PT4_5_2_5 = toggleYN_PT4_5_2_5;
    window.addRoute_PT4_5_2_5 = addRoute_PT4_5_2_5;
    window.resetRoute_PT4_5_2_5 = resetRoute_PT4_5_2_5;
    window.addArrow_PT4_5_2_5 = addArrow_PT4_5_2_5;
    window.modifyCondition_PT4_5_2_5 = modifyCondition_PT4_5_2_5;
    window.modifyText_PT4_5_2_5 = modifyText_PT4_5_2_5;
    window.checkAnswer_PT4_5_2_5 = checkAnswer_PT4_5_2_5;
    window.showAnswer_PT4_5_2_5 = showAnswer_PT4_5_2_5;
    window.resetElem_PT4_5_2_5 = resetElem_PT4_5_2_5;
  };

  window.reactivate_PT4_5_2_5();
</script>
